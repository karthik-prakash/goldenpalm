<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Golden Palm Gallery Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #800020;
            --primary-light: #a0324f;
            --gold: #D4A843;
            --gold-light: #e8c76a;
            --cream: #FFF8F0;
            --cream-dark: #f5eadb;
            --brown: #3E2723;
            --white: #FFFFFF;
            --gray: #777;
            --green: #4CAF50;
            --red: #f44336;
            --shadow: 0 10px 40px rgba(0,0,0,0.1);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--cream);
            color: var(--brown);
            min-height: 100vh;
        }

        /* ========== HEADER ========== */
        .admin-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: var(--white);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .admin-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-header h1 i {
            color: var(--gold);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-btn {
            padding: 10px 20px;
            border: 2px solid var(--gold);
            background: transparent;
            color: var(--gold);
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover {
            background: var(--gold);
            color: var(--white);
        }

        .header-btn.danger {
            border-color: var(--red);
            color: var(--red);
        }

        .header-btn.danger:hover {
            background: var(--red);
            color: var(--white);
        }

        /* ========== MAIN LAYOUT ========== */
        .admin-main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* ========== STATS ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card .stat-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        .stat-card .stat-icon i {
            color: var(--gold);
            font-size: 1.2rem;
        }

        .stat-card .stat-value {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ========== UPLOAD SECTION ========== */
        .upload-section {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .upload-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-section h2 i {
            color: var(--gold);
        }

        .upload-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .upload-dropzone {
            grid-column: 1 / -1;
            border: 3px dashed var(--cream-dark);
            border-radius: var(--radius);
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--cream);
            position: relative;
        }

        .upload-dropzone:hover,
        .upload-dropzone.dragover {
            border-color: var(--gold);
            background: rgba(212, 168, 67, 0.05);
        }

        .upload-dropzone i {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .upload-dropzone h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: var(--brown);
        }

        .upload-dropzone p {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .upload-dropzone input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            grid-column: 1 / -1;
            display: none;
            text-align: center;
        }

        .preview-container img {
            max-width: 300px;
            max-height: 300px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 10px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field label {
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--brown);
        }

        .form-field input,
        .form-field select {
            padding: 12px 16px;
            border: 2px solid var(--cream-dark);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: var(--brown);
            background: var(--cream);
            outline: none;
            transition: all 0.3s ease;
        }

        .form-field input:focus,
        .form-field select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212, 168, 67, 0.1);
        }

        .upload-btn {
            grid-column: 1 / -1;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: var(--white);
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .upload-btn:hover {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 168, 67, 0.3);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== GALLERY MANAGEMENT ========== */
        .gallery-section {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .gallery-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gallery-section h2 i {
            color: var(--gold);
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--cream);
        }

        .filter-tag {
            padding: 8px 18px;
            background: var(--cream);
            border: 2px solid transparent;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--brown);
        }

        .filter-tag:hover,
        .filter-tag.active {
            background: var(--gold);
            color: var(--white);
            border-color: var(--gold);
        }

        .admin-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .admin-gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            background: var(--cream);
        }

        .admin-gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .admin-gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .admin-gallery-item .item-info {
            padding: 15px;
        }

        .admin-gallery-item .item-info h4 {
            font-size: 0.9rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-gallery-item .item-info .category-badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--gold);
            color: var(--white);
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: capitalize;
        }

        .admin-gallery-item .item-info .date {
            font-size: 0.75rem;
            color: var(--gray);
            margin-top: 6px;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(244, 67, 54, 0.9);
            color: var(--white);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .admin-gallery-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: var(--red);
            transform: scale(1.1);
        }

        .empty-gallery {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .empty-gallery i {
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* ========== NOTIFICATION ========== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideIn 0.4s ease;
        }

        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        .toast.info { background: #2196F3; }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ========== CONFIRM MODAL ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--white);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .modal p {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 25px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 28px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 2px solid;
            transition: all 0.3s ease;
        }

        .modal-btn.cancel {
            background: transparent;
            border-color: var(--cream-dark);
            color: var(--gray);
        }

        .modal-btn.confirm {
            background: var(--red);
            border-color: var(--red);
            color: var(--white);
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .upload-form {
                grid-template-columns: 1fr;
            }

            .upload-section, .gallery-section {
                padding: 25px;
            }

            .admin-gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .admin-gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="admin-header">
        <h1><i class="fas fa-cog"></i> Golden Palm — Gallery Admin</h1>
        <div class="header-actions">
            <a href="index.html" class="header-btn"><i class="fas fa-eye"></i> View Site</a>
            <button class="header-btn danger" onclick="confirmResetGallery()"><i class="fas fa-redo"></i> Reset Gallery</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid"></div>

        <!-- Upload Section -->
        <div class="upload-section">
            <h2><i class="fas fa-cloud-upload-alt"></i> Upload New Design</h2>
            <form class="upload-form" id="uploadForm">
                <div class="upload-dropzone" id="dropzone">
                    <i class="fas fa-images"></i>
                    <h3>Drag & Drop your design here</h3>
                    <p>or click to browse — supports JPG, PNG, WebP (max 5MB)</p>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="previewImg" src="" alt="Preview">
                    <p style="font-size: 0.85rem; color: var(--gray);">Preview</p>
                </div>
                <div class="form-field">
                    <label for="designTitle"><i class="fas fa-pen"></i> Design Title</label>
                    <input type="text" id="designTitle" placeholder="e.g. Royal Bridal Full Hand" required>
                </div>
                <div class="form-field">
                    <label for="designCategory"><i class="fas fa-tag"></i> Category</label>
                    <select id="designCategory" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="bridal">💍 Bridal</option>
                        <option value="babyshower">👶 Baby Shower</option>
                        <option value="festival">🪔 Festival</option>
                        <option value="arabic">🌙 Arabic</option>
                        <option value="indowestern">💎 Indo-Western</option>
                        <option value="kids">🦋 Kids</option>
                    </select>
                </div>
                <button type="submit" class="upload-btn" id="uploadBtn" disabled>
                    <i class="fas fa-upload"></i> Upload to Gallery
                </button>
            </form>
        </div>

        <!-- Gallery Management -->
        <div class="gallery-section">
            <h2><i class="fas fa-th"></i> Manage Gallery</h2>
            <div class="filter-bar" id="adminFilterBar">
                <button class="filter-tag active" data-filter="all">All</button>
                <button class="filter-tag" data-filter="bridal">💍 Bridal</button>
                <button class="filter-tag" data-filter="babyshower">👶 Baby Shower</button>
                <button class="filter-tag" data-filter="festival">🪔 Festival</button>
                <button class="filter-tag" data-filter="arabic">🌙 Arabic</button>
                <button class="filter-tag" data-filter="indowestern">💎 Indo-Western</button>
                <button class="filter-tag" data-filter="kids">🦋 Kids</button>
            </div>
            <div class="admin-gallery-grid" id="adminGalleryGrid"></div>
        </div>
    </main>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Are you sure?</h3>
            <p id="modalMessage">This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn confirm" id="modalConfirm">Delete</button>
            </div>
        </div>
    </div>

    <!-- Load Gallery Manager -->
    <script src="js/gallery.js"></script>

    <script>
        // ========== ADMIN PANEL LOGIC ==========
        
        const STORAGE_KEY = 'goldenpalm_gallery';
        let selectedFile = null;
        let currentAdminFilter = 'all';

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', () => {
            renderStats();
            renderAdminGallery();
            setupAdminFilters();
            setupUpload();
        });

        // ---- Stats ----
        function renderStats() {
            const images = getGalleryData();
            const categories = {};
            images.forEach(img => {
                categories[img.category] = (categories[img.category] || 0) + 1;
            });

            const statsHTML = `
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-images"></i></div>
                    <div class="stat-value">${images.length}</div>
                    <div class="stat-label">Total Designs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-ring"></i></div>
                    <div class="stat-value">${categories['bridal'] || 0}</div>
                    <div class="stat-label">Bridal</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-baby"></i></div>
                    <div class="stat-value">${categories['babyshower'] || 0}</div>
                    <div class="stat-label">Baby Shower</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-moon"></i></div>
                    <div class="stat-value">${categories['arabic'] || 0}</div>
                    <div class="stat-label">Arabic</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-gem"></i></div>
                    <div class="stat-value">${categories['indowestern'] || 0}</div>
                    <div class="stat-label">Indo-Western</div>
                </div>
            `;
            document.getElementById('statsGrid').innerHTML = statsHTML;
        }

        // ---- Get Data ----
        function getGalleryData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        function saveGalleryData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // ---- Render Admin Gallery ----
        function renderAdminGallery() {
            const grid = document.getElementById('adminGalleryGrid');
            const images = getGalleryData();
            const filtered = currentAdminFilter === 'all' 
                ? images 
                : images.filter(img => img.category === currentAdminFilter);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-gallery">
                        <i class="fas fa-folder-open"></i>
                        <p>No designs found. Upload your first design above!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(img => `
                <div class="admin-gallery-item">
                    <img src="${img.src}" alt="${img.title}">
                    <button class="delete-btn" onclick="confirmDelete(${img.id})" title="Delete">
                        <i class="fas fa-trash"></i>
                    </button>
                    <div class="item-info">
                        <h4>${img.title}</h4>
                        <span class="category-badge">${img.category}</span>
                        <p class="date">${img.date || 'No date'}</p>
                    </div>
                </div>
            `).join('');
        }

        // ---- Filters ----
        function setupAdminFilters() {
            const filterBtns = document.querySelectorAll('.filter-tag');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentAdminFilter = btn.getAttribute('data-filter');
                    renderAdminGallery();
                });
            });
        }

        // ---- Upload ----
        function setupUpload() {
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            const previewContainer = document.getElementById('previewContainer');
            const previewImg = document.getElementById('previewImg');
            const uploadBtn = document.getElementById('uploadBtn');
            const uploadForm = document.getElementById('uploadForm');

            // Drag & drop
            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });

            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('dragover');
            });

            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length) handleFile(files[0]);
            });

            // File input
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            function handleFile(file) {
                if (!file.type.startsWith('image/')) {
                    showToast('Please select an image file', 'error');
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    showToast('File too large! Max 5MB allowed', 'error');
                    return;
                }

                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    previewContainer.style.display = 'block';
                    uploadBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            }

            // Form submit
            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (!selectedFile) {
                    showToast('Please select an image', 'error');
                    return;
                }

                const title = document.getElementById('designTitle').value.trim();
                const category = document.getElementById('designCategory').value;

                if (!title || !category) {
                    showToast('Please fill in all fields', 'error');
                    return;
                }

                uploadBtn.disabled = true;
                uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';

                // Read file and save
                const reader = new FileReader();
                reader.onload = (e) => {
                    const images = getGalleryData();
                    images.push({
                        id: Date.now(),
                        src: e.target.result,
                        title: title,
                        category: category,
                        date: new Date().toISOString().split('T')[0]
                    });
                    saveGalleryData(images);

                    // Reset form
                    uploadForm.reset();
                    previewContainer.style.display = 'none';
                    selectedFile = null;
                    uploadBtn.disabled = true;
                    uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload to Gallery';

                    // Refresh
                    renderStats();
                    renderAdminGallery();
                    showToast('Design uploaded successfully! 🎉', 'success');
                };
                reader.readAsDataURL(selectedFile);
            });
        }

        // ---- Delete ----
        let deleteTargetId = null;

        function confirmDelete(id) {
            deleteTargetId = id;
            document.getElementById('modalTitle').textContent = 'Delete Design?';
            document.getElementById('modalMessage').textContent = 'This will remove the design from your gallery. This cannot be undone.';
            document.getElementById('modalConfirm').textContent = 'Delete';
            document.getElementById('modalConfirm').onclick = () => {
                const images = getGalleryData().filter(img => img.id !== deleteTargetId);
                saveGalleryData(images);
                renderStats();
                renderAdminGallery();
                closeModal();
                showToast('Design deleted', 'info');
            };
            document.getElementById('modalOverlay').classList.add('active');
        }

        function confirmResetGallery() {
            document.getElementById('modalTitle').textContent = 'Reset Entire Gallery?';
            document.getElementById('modalMessage').textContent = 'This will delete ALL uploaded designs and restore defaults. This cannot be undone!';
            document.getElementById('modalConfirm').textContent = 'Reset All';
            document.getElementById('modalConfirm').onclick = () => {
                localStorage.removeItem(STORAGE_KEY);
                // Re-init with defaults
                if (window.GalleryManager) {
                    GalleryManager.galleryImages = GalleryManager.getDefaultGallery();
                    GalleryManager.saveGallery();
                }
                renderStats();
                renderAdminGallery();
                closeModal();
                showToast('Gallery has been reset to defaults', 'info');
            };
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Close modal on overlay click
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) closeModal();
        });

        // ---- Toast Notification ----
        function showToast(message, type = 'info') {
            const existing = document.querySelectorAll('.toast');
            existing.forEach(t => t.remove());

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
</body>
</html>
